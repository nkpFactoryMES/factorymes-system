services:
  mes-backend:
    networks:
    - app
    - oracle-data
    - delivery-capture
  mailpit:
    image: axllent/mailpit:v1.34.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '5000'
      MP_DISABLE_VERSION_CHECK: 'true'
    volumes:
    - mailpit-data:/data
    networks:
    - delivery-capture
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 10s
      timeout: 5s
      retries: 8
  chat-receiver:
    image: factorymes/chat-receiver:dev
    build:
      context: ../../factorymes-chat-receiver
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ChatReceiver__JournalPath: /var/factorymes/chat-captures/journal.json
      ExecutionPolicy__CloudAiEnabled: 'false'
      ExecutionPolicy__ExternalDeliveryEnabled: 'false'
    volumes:
    - chat-capture-data:/var/factorymes/chat-captures
    networks:
    - delivery-capture
    init: true
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - dotnet
      - FactoryMES.ChatReceiver.dll
      - --healthcheck
      - http://localhost:8080/health/ready
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
volumes:
  mailpit-data: {}
  chat-capture-data: {}
networks:
  delivery-capture:
    internal: true
