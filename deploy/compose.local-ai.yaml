services:
  ai-connector:
    networks:
    - app
    - inference
  local-ai:
    image: ollama/ollama:0.11.11
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '2048'
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_FLASH_ATTENTION: '0'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - local-ai-models:/root/.ollama
    networks:
    - inference
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
volumes:
  local-ai-models: {}
networks:
  inference:
    internal: true
